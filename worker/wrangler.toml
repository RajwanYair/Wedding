name = "wedding-ai-proxy"
main = "index.js"
compatibility_date = "2026-05-01"

[vars]
ALLOWED_ORIGINS = "https://rajwanyair.github.io,http://localhost:5173,http://localhost:4173"
# Set OLLAMA_ORIGIN to your self-hosted Ollama base URL (e.g. https://ollama.example.com).
# Leave empty to disable Ollama routing in the hosted Worker.
OLLAMA_ORIGIN = ""
# Optional: per-request timeout in milliseconds (default: 30000).
REQUEST_TIMEOUT_MS = "30000"

# Secrets (set via `wrangler secret put <NAME>`):
#   None — API keys are forwarded from the browser via Authorization header.
#   The Worker never stores or logs them.

[limits]
cpu_ms = 50

# ── S699: Production environment with custom domain ───────────────────────

[env.production]
name = "wedding-ai-proxy-prod"
vars = { ALLOWED_ORIGINS = "https://wedding.rajwanyair.com,https://rajwanyair.github.io", OLLAMA_ORIGIN = "", REQUEST_TIMEOUT_MS = "30000" }

# Custom route: requests to api.wedding.rajwanyair.com/* are handled by this Worker.
# To activate: set zone_name to your Cloudflare-managed domain,
# then create a CNAME record: api.wedding.rajwanyair.com → <worker-subdomain>.workers.dev
[[env.production.routes]]
pattern = "api.wedding.rajwanyair.com/*"
zone_name = "rajwanyair.com"

# ── Staging environment ────────────────────────────────────────────────────

[env.staging]
name = "wedding-ai-proxy-staging"
vars = { ALLOWED_ORIGINS = "https://rajwanyair.github.io,http://localhost:5173", OLLAMA_ORIGIN = "", REQUEST_TIMEOUT_MS = "30000" }
