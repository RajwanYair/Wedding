<div class="card">
  <div class="card-header">
    <span class="icon">💸</span>
    <span data-i18n="budget_expenses_title">הוצאות האירוע</span>
    <div id="expenseAdminBar" class="admin-bar u-hidden">
      <button class="btn btn-primary btn-small" data-action="openAddExpenseModal">
        ➕ <span data-i18n="expense_add">הוסף הוצאה</span>
      </button>
      <button
        class="btn btn-ghost btn-small"
        data-action="exportExpensesCSV"
        data-i18n="export_expenses_csv"
      >
        📥 ייצוא CSV
      </button>
    </div>
  </div>

  <!-- Category filter chip -->
  <div class="action-bar u-mb-sm">
    <span class="label-muted" data-i18n="expense_filter_by_cat">סינון לפי קטגוריה:</span>
    <button
      id="expCatFilterChip"
      class="btn btn-chip btn-ghost u-text-sm"
      data-action="setExpenseCategoryFilter"
      data-action-arg="all"
      data-i18n="all_categories"
    >הכל</button>
  </div>

  <!-- Expense total stat -->
  <div class="expense-stats-row">
    <div class="stat-card stat-card--flex-lg">
      <div class="stat-value" id="expenseStatTotal">—</div>
      <div class="stat-label" data-i18n="expense_total">סה"כ הוצאות</div>
    </div>
  </div>

  <!-- Expense table -->
  <div class="u-overflow-x">
    <table class="guest-table u-w-full">
      <thead>
        <tr>
          <th data-i18n="col_expense_category">קטגוריה</th>
          <th data-i18n="col_expense_desc">תיאור</th>
          <th data-i18n="col_expense_date">תאריך</th>
          <th class="u-text-end" data-i18n="col_expense_amount">סכום</th>
          <th id="expenseActionsHeader" class="u-text-center u-hidden" data-i18n="col_actions">פעולות</th>
        </tr>
      </thead>
      <tbody id="expenseList"></tbody>
    </table>
  </div>

  <div id="expenseEmpty" class="budget-empty">
    <span class="empty-emoji">💸</span>
    <p data-i18n="expense_empty">אין הוצאות עדיין. הוסף את הוצאות האירוע כאן.</p>
  </div>
</div>

<!-- Top expense categories analytics panel -->
<div class="card" id="expenseTopCategoriesCard">
  <div class="card-header">
    <span class="icon">🏆</span>
    <span data-i18n="expense_top_categories">קטגוריות הוצאות עיקריות</span>
  </div>
  <div id="expenseTopCategories"></div>
</div>
