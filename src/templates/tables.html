<div class="card">
        <div class="card-header">
          <span class="icon">🪑</span> <span data-i18n="tables_title">סידורי ישיבה</span>
          <div class="section-toolbar-start">
            <button class="btn btn-primary btn-small" data-action="openAddTableModal">
              <span>➕</span> <span data-i18n="action_add_table">הוסף שולחן</span>
            </button>
            <button class="btn btn-secondary btn-small" data-action="printSeatingChart" data-i18n-tooltip="tip_print_seating">
              <span>🖨️</span> <span data-i18n="action_print_seating">ייצוא תרשים ישיבה</span>
            </button>
            <button class="btn btn-secondary btn-small" data-action="autoAssignTables" data-i18n-tooltip="tip_auto_assign">
              <span>🪄</span> <span data-i18n="btn_auto_assign">שיבוץ אוטומטי</span>
            </button>
            <button class="btn btn-ghost btn-small" data-action="toggleSeatingConstraints">
              <span>⚙️</span> <span data-i18n="btn_seating_constraints">הגדרות שיבוץ</span>
            </button>
            <button class="btn btn-secondary btn-small" data-action="exportSeatMapCsv" data-i18n-tooltip="tip_export_seating_csv">
              <span>📥</span> <span data-i18n="btn_export_seating_csv">ייצוא CSV</span>
            </button>
            <button class="btn btn-secondary btn-small" data-action="exportSeatMapJson" data-i18n-tooltip="tip_export_seating_json">
              <span>📋</span> <span data-i18n="btn_export_seating_json">ייצוא JSON</span>
            </button>
            <button class="btn btn-secondary btn-small" data-action="printTableLayout">
              <span>🖨️</span> <span data-i18n="btn_export_pdf_tables">ייצא PDF שולחנות</span>
            </button>
          </div>
        </div>
        <div class="seating-floor" id="seatingFloor">
        </div>
        <div class="empty-state" id="tablesEmpty">
          <div class="icon">🍽️</div>
          <p data-i18n="tables_empty">עדיין לא הגדרת שולחנות. לחץ על "הוסף שולחן" כדי להתחיל!</p>
          <p class="empty-sub">👆 ➕</p>
        </div>
      </div>

      <!-- S690: Seating constraint config panel -->
      <div class="card" id="seatingConstraintsPanel" hidden>
        <div class="card-header">
          <span class="icon">⚙️</span>
          <span data-i18n="seating_constraints_title">הגדרות שיבוץ אוטומטי</span>
        </div>
        <div style="padding:1rem">
          <p style="font-size:0.875rem;margin-bottom:0.75rem" data-i18n="seating_constraints_hint">
            הגדר כיצד ה-AI ישבץ אורחים: מי יושב יחד ומי בנפרד.
          </p>
          <div class="form-group">
            <label for="constraintGuestA" data-i18n="constraint_guest_a">אורח א׳</label>
            <input id="constraintGuestA" list="constraintGuestListA" autocomplete="off"
              data-i18n-placeholder="ph_constraint_guest" placeholder="שם אורח..." />
            <datalist id="constraintGuestListA"></datalist>
          </div>
          <div class="form-group">
            <label for="constraintGuestB" data-i18n="constraint_guest_b">אורח ב׳</label>
            <input id="constraintGuestB" list="constraintGuestListB" autocomplete="off"
              data-i18n-placeholder="ph_constraint_guest" placeholder="שם אורח..." />
            <datalist id="constraintGuestListB"></datalist>
          </div>
          <div class="form-group" style="display:flex;gap:0.5rem;align-items:center">
            <label for="constraintType" data-i18n="constraint_type">סוג אילוץ</label>
            <select id="constraintType" style="flex:1">
              <option value="together" data-i18n="constraint_together">יחד</option>
              <option value="apart" data-i18n="constraint_apart">בנפרד</option>
            </select>
          </div>
          <button class="btn btn-primary btn-small" data-action="addSeatingConstraint">
            <span>➕</span> <span data-i18n="btn_add_constraint">הוסף אילוץ</span>
          </button>
          <div id="seatingConstraintList" style="margin-top:1rem"></div>
          <div id="seatingViolations" style="margin-top:0.5rem"></div>
        </div>
      </div>

      <!-- Unassigned Guests -->
      <div class="card" id="unassignedCard" data-i18n-tooltip="tip_unassigned">
        <div class="card-header"><span class="icon">🔀</span> <span data-i18n="unassigned_title">אורחים ללא שולחן</span></div>
        <div id="unassignedGuests"></div>
      </div>

      <!-- S11.2 Transport Manifest -->
      <div class="card" id="transportManifestCard">
        <div class="card-header">
          <span class="icon">🚌</span>
          <span data-i18n="transport_manifest_title">רשימת הסעות</span>
          <div class="section-toolbar-start">
            <button class="btn btn-secondary btn-small" data-action="exportTransportCSV">
              <span>📥</span> <span data-i18n="transport_export_csv">ייצוא CSV</span>
            </button>
            <button class="btn btn-secondary btn-small" data-action="printTransportManifest">
              <span>🖨️</span> <span data-i18n="transport_print">הדפסה</span>
            </button>
          </div>
        </div>
        <div id="transportManifest"></div>
      </div>

      <!-- S691: Floor-plan canvas -->
      <div class="card" id="floorPlanCard">
        <div class="card-header">
          <span class="icon">🗺️</span>
          <span data-i18n="floor_plan_title">תכנית אולם</span>
          <div class="section-toolbar-start">
            <select id="floorPlanPreset" style="font-size:0.8rem;padding:0.2rem 0.5rem">
              <option value="" data-i18n="floor_plan_preset_none">בחר פריסה...</option>
              <option value="banquet" data-i18n="floor_plan_preset_banquet">באנקט</option>
              <option value="u_shape" data-i18n="floor_plan_preset_u">U-Shape</option>
              <option value="cocktail" data-i18n="floor_plan_preset_cocktail">קוקטייל</option>
            </select>
            <button class="btn btn-primary btn-small" data-action="applyFloorPlanPreset">
              <span data-i18n="floor_plan_apply">החל פריסה</span>
            </button>
            <button class="btn btn-secondary btn-small" data-action="exportFloorPlanSvg">
              <span>📥</span> <span data-i18n="floor_plan_export_svg">ייצוא SVG</span>
            </button>
          </div>
        </div>
        <div id="floorPlanCanvas" style="overflow:auto;min-height:200px;padding:0.5rem"></div>
        <div id="floorPlanCollisions" style="padding:0.25rem 1rem;font-size:0.8rem"></div>
      </div>
