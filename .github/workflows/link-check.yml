# =============================================================================
# Markdown Link Check — Wedding Manager
#
# Monthly cron + manual dispatch. **Never blocks PRs** by design — link rot
# is a non-deterministic, network-dependent failure mode that should be
# triaged on a slow cadence rather than gating every commit.
#
# Output: opens an issue if dead links are found; otherwise runs silently.
#
# Harvested from FamilyDashBoard parallel project (May 2026).
# =============================================================================
name: Markdown Link Check

on:
  schedule:
    # 04:17 UTC on the 1st of each month — odd minute to avoid the hourly stampede.
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  link-check:
    name: markdown-link-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run markdown-link-check
        id: lc
        continue-on-error: true
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock markdown-link-check@^3.13.0 >/dev/null

          echo "→ Scanning .md files (excluding node_modules, dist, coverage)…"
          FAILED=0
          REPORT=""
          mapfile -t FILES < <(find . -type f -name "*.md" \
            -not -path "./node_modules/*" \
            -not -path "./dist/*" \
            -not -path "./coverage/*" \
            -not -path "./store/*" \
            -not -path "./test-results/*")

          for f in "${FILES[@]}"; do
            OUT=$(npx markdown-link-check --quiet --config .github/link-check.config.json "$f" 2>&1 || true)
            if echo "$OUT" | grep -qE "ERROR:|✖"; then
              REPORT+="### $f"$'\n```\n'"$OUT"$'\n```\n\n'
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            {
              echo "report<<__EOF__"
              echo "$REPORT"
              echo "__EOF__"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::Dead links detected — see issue body."
          else
            echo "✅ No dead links."
          fi
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Open issue on failure
        if: steps.lc.outputs.failed == '1'
        uses: actions/github-script@v9
        with:
          script: |
            const body = `## 🔗 Dead Links Detected\n\nThe monthly markdown link checker found dead links in the repository.\n\n${process.env.REPORT}\n\n---\n\n_Generated by \`.github/workflows/link-check.yml\`._`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dead links detected — ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ["documentation", "chore"],
            });
        env:
          REPORT: ${{ steps.lc.outputs.report }}
